# Pings IndexNow (Bing, Yandex, partners) after Vercel finishes a production deploy,
# so the submitted URLs already serve the new content. The script reads the URL
# list from the live sitemap.xml.
# Optional: add repo secret INDEXNOW_KEY if you rotate the key; otherwise the
# default key file a1b2c3d4e5f6g7h8.txt must exist in public/.

name: IndexNow ping

on:
  deployment_status:
  workflow_dispatch:

jobs:
  indexnow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow-ping.mjs
